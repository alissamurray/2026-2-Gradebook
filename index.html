<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f4f7f6; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    
    input { display: block; width: 100%; margin: 15px 0; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #0056b3; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
    button:hover { background: #004494; }
    
    /* Standard Categories */
    .summary-container { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
    .summary-card { background: #e9ecef; padding: 15px; border-radius: 8px; flex: 1; min-width: 150px; text-align: center; border-left: 4px solid #0056b3; }
    
    /* Exam Categories (Larger at the bottom) */
    .exam-container { display: flex; flex-wrap: wrap; gap: 15px; margin: 15px 0 25px 0; }
    .summary-card.exam { background: #eef2f5; padding: 20px; border-left: 5px solid #d9534f; }
    .summary-card.exam h4 { color: #d9534f; font-size: 16px; }
    .summary-card.exam .score { font-size: 24px; color: #222; }

    .summary-card h4 { margin: 0 0 10px 0; font-size: 14px; color: #555; text-transform: uppercase; }
    .summary-card .score { font-size: 20px; font-weight: bold; color: #222; }
    .summary-card .converted { font-size: 13px; color: #0056b3; margin-top: 6px; font-weight: 600; }
    .summary-card.exam .converted { color: #d9534f; font-size: 14px; }

    .table-container { overflow-x: auto; margin-top: 20px; border-radius: 5px; border: 1px solid #ddd; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; text-align: left; white-space: nowrap; }
    th { background: #f8f9fa; font-weight: bold; color: #444; }
    tr:hover { background-color: #f1f5f9; }
  </style>
</head>
<body>

  <div class="container" id="loginScreen">
    <h2 style="text-align: center;">Student Portal Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="errorMsg" style="color:red; text-align: center; margin-top: 15px;"></p>
  </div>

  <div class="container hidden" id="dashboard">
    <h1 id="studentName" style="margin-bottom: 5px;"></h1>
    <h2 style="color: #0056b3; margin-top: 0;">Overall Grade: <span id="overallGrade"></span></h2>
    
    <div id="categorySummaries" class="summary-container"></div>
    <div id="examSummaries" class="exam-container"></div>

    <div class="table-container">
      <table id="assignmentsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Assignment Name</th>
            <th>Category</th>
            <th>Score</th>
            <th>Max Points</th>
            <th>Percentage</th>
          </tr>
        </thead>
        <tbody id="assignmentsBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxt0brfk2CuESz8RHj6F5ygeAp2-UyUpqQl6_vmkukhr5ALC3eW3CebmGIxHD9kjMsyBA/exec";

    function login() {
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;
      document.getElementById("errorMsg").innerText = "Logging in...";

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ username: u, password: p })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          showDashboard(data.data);
        } else {
          document.getElementById("errorMsg").innerText = data.message;
        }
      })
      .catch(err => {
        document.getElementById("errorMsg").innerText = "Error connecting to the database.";
      });
    }

    function parsePercent(val) {
      let n = parseFloat(val);
      if (isNaN(n)) return NaN;
      if (n !== 0 && n <= 1.5 && String(val).indexOf('%') === -1) {
        return n * 100;
      }
      return n;
    }

    function showDashboard(data) {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("studentName").innerText = data.name;
      
      let gradeNum = parsePercent(data.overallGrade);
      document.getElementById("overallGrade").innerText = isNaN(gradeNum) ? data.overallGrade : gradeNum.toFixed(1) + "%";

      const catDiv = document.getElementById("categorySummaries");
      const examDiv = document.getElementById("examSummaries");
      catDiv.innerHTML = "";
      examDiv.innerHTML = "";

      if (data.categorySummaries && data.categorySummaries.length > 0) {
        data.categorySummaries.forEach(cat => {
          let rawScore = parsePercent(cat.score);
          let scoreDisplay = isNaN(rawScore) ? cat.score : rawScore.toFixed(1) + "%";
          
          let weightRaw = parsePercent(data.weights[cat.name]);
          let convertedHTML = "";
          
          if (!isNaN(rawScore) && !isNaN(weightRaw)) {
            let convertedPoints = (rawScore / 100) * weightRaw;
            convertedHTML = `<div class="converted">Converted: ${convertedPoints.toFixed(1)} / ${weightRaw.toFixed(1)} pts</div>`;
          }

          let isExam = cat.name.toUpperCase().includes("MIDTERM") || cat.name.toUpperCase().includes("FINAL");
          let cardHTML = `
            <div class="summary-card ${isExam ? 'exam' : ''}">
              <h4>${cat.name}</h4>
              <div class="score">${scoreDisplay}</div>
              ${convertedHTML}
            </div>
          `;

          if (isExam) {
            examDiv.innerHTML += cardHTML;
          } else {
            catDiv.innerHTML += cardHTML;
          }
        });
      }

      const tbody = document.getElementById("assignmentsBody");
      tbody.innerHTML = "";
      data.assignments.forEach(a => {
        let pctStr = "-";
        let s = parseFloat(a.score);
        let t = parseFloat(a.total);
        if (!isNaN(s) && !isNaN(t) && t !== 0) {
           pctStr = ((s / t) * 100).toFixed(1) + "%";
        }

        tbody.innerHTML += `
          <tr>
            <td>${a.date}</td>
            <td>${a.name}</td>
            <td>${a.category}</td>
            <td>${a.score}</td>
            <td>${a.total}</td>
            <td><strong>${pctStr}</strong></td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
